services:
  # Laravel Backend Service
  VTO_Backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: vto-backend-image
    container_name: VTO_Backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      - db
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=sqlite

  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: vto_mysql
    restart: unless-stopped
    ports:
      - "3309:3306"
    environment:
      MYSQL_DATABASE: vto_glasses
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: vto_user
      MYSQL_PASSWORD: vto_password
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
